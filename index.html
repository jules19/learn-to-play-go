<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Way of Go — Learn to Play</title>
<meta name="description" content="A beautiful interactive way to learn the game of Go: guided lessons, puzzles, and games against a friendly AI.">
<meta name="theme-color" content="#16120e">
<meta property="og:title" content="The Way of Go — Learn to Play">
<meta property="og:description" content="From your first stone to your first victory: hands-on lessons, puzzles, and games against a friendly AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='38' cy='38' r='30' fill='%23111'/><circle cx='66' cy='66' r='30' fill='%23f5f2e8' stroke='%23999' stroke-width='2'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandHome" title="Home">
    <span class="brand-kanji">碁</span>
    <div class="brand-text">
      <span class="brand-title">The Way of Go</span>
      <span class="brand-sub">an interactive journey for beginners</span>
    </div>
  </div>
  <div class="top-status">
    <div class="rank-chip" id="rankChip" title="Your rank — earn XP to climb from 30 kyu toward mastery">
      <span class="rank-label" id="rankLabel">30 kyu</span>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <span class="xp-text" id="xpText">0 XP</span>
    </div>
    <button class="icon-btn" id="badgesBtn" title="Your achievements">🏅</button>
    <button class="icon-btn" id="soundBtn" title="Toggle sound">🔊</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-view="learn">📖 Learn</button>
  <button class="tab" data-view="puzzles">🧩 Puzzles</button>
  <button class="tab" data-view="play">⚔️ Play</button>
  <button class="tab" data-view="guide">🏮 Guide</button>
</nav>

<main id="view"></main>

<footer class="proverb-bar">
  <span class="proverb-mark">「</span>
  <span id="proverb"></span>
  <span class="proverb-mark">」</span>
</footer>

<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/board.js"></script>
<script src="js/ai.js"></script>
<script src="js/lessons.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
