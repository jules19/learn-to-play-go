name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/go-learning-tool-bhrn0i
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests (engine, AI, all lessons & puzzles)
        run: node --test test/*.test.js

  # Pages is configured with Source: "Deploy from a branch" (gh-pages).
  # This branch is a publish target only — it is never merged or deleted.
  publish-branch:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'Deploy site'
